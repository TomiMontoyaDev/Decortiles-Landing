# Render Blueprint: la landing como Static Site (HTML puro, sin servidor que se duerma).
# Render → New → Blueprint → elegir este repo. Las variables con `sync: false` se piden
# en el panel al crear el servicio (no se guardan en git).
# Formulario y dashboard /admin/ usan Supabase: ver README, sección 4.
services:
  - type: web
    name: decortiles-landing
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:static
    staticPublishPath: ./out
    headers:
      # Landing solo para pauta: que ningún buscador la indexe.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://proyectos.decorcolombiatiles.com
      - key: NEXT_PUBLIC_WHATSAPP
        value: "573128019754"
      # Supabase → Project Settings → API.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      - key: NEXT_PUBLIC_GADS_CONVERSION
        sync: false
