# Publica la versión estática de la landing en GitHub Pages.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# El formulario necesita una API con servidor: definir la variable de repositorio LEAD_ENDPOINT
# (Settings → Secrets and variables → Actions → Variables), p. ej. https://<servicio>.onrender.com/api/lead
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build estático (out/)
        run: npm run build:static
        env:
          # /Decortiles-Landing en <usuario>.github.io; vacío si se configura dominio propio.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
          NEXT_PUBLIC_WHATSAPP: ${{ vars.WHATSAPP }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_GADS_CONVERSION: ${{ vars.GADS_CONVERSION }}

      # Sin esto, Pages ignora la carpeta _next/ (Jekyll descarta lo que empieza por "_").
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
